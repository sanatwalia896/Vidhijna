name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - staging          # triggers on every push to staging

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1                          # US central for always free tier 
  SERVICE: vidhijna-api                         # Cloud Run service name
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/vidhijna-api

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest                      # Linux AMD64 — correct arch for Cloud Run

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Authenticate with GCP using Service Account Key ──────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ── 3. Set up gcloud CLI ─────────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── 4. Configure Docker to push to GCR ──────────────────────────────────
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      # ── 5. Build Docker image (ubuntu runner = linux/amd64 natively) ─────────
      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      # ── 6. Push to Google Container Registry ─────────────────────────────────
      - name: Push image to GCR
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # ── 7. Deploy to Cloud Run ───────────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --cpu 1 \
            --port 8000 \
            --timeout 300 \
            --set-env-vars "\
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},\
            HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }},\
            PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }},\
            PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }},\
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}"

      # ── 8. Print the deployed URL ────────────────────────────────────────────
      - name: Show deployed URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)"